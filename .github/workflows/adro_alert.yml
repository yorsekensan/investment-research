name: ADRO Regime Alert Engine

on:
  schedule:
    # Runs hourly Monday - Friday during IDX trading hours (02:00 UTC - 09:00 UTC / 09:00 WIB - 16:00 WIB)
    - cron: '0 2-9 * * 1-5'
  workflow_dispatch: # Enables manual run button in Actions tab

jobs:
  run-alert-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Execute ADRO Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python adro_engine.py
