name: Quantitative Macro Alerts

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # 4x a day (07:00, 13:00, 19:00, 01:00 WIB)
  workflow_dispatch: # Allows manual trigger

jobs:
  run-matrix-evaluator:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for git-auto-commit-action@v5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run Alert Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update state.json"
